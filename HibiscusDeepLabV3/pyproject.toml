
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hibiscus-segmentation"
version = "0.1.0"
description = "Hibiscus image segmentation using DeepLabV3 and Mask R-CNN"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "pillow>=10.0",
    "scipy>=1.11",
    "torchmetrics>=1.4",
    "pycocotools>=2.0.8",
]

[tool.setuptools]
py-modules = []
